
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Only Habesha Admin</title>

<style>
body{
  margin:0;
  background:#120d18;
  color:#fff8ef;
  font-family:system-ui,sans-serif;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  box-sizing:border-box
}
.box{
  width:min(430px,100%);
  background:#211729;
  border:1px solid #4b3856;
  border-radius:16px;
  padding:24px;
  box-sizing:border-box
}
h1{color:#e8bd62}
h2{font-size:20px}
.muted{color:#c9bdcf}
label{
  display:block;
  margin:14px 0 6px
}
input{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border-radius:8px;
  border:1px solid #4b3856;
  background:#130e18;
  color:white
}
button{
  background:#e8bd62;
  color:#1b1220;
  border:0;
  border-radius:8px;
  padding:12px 16px;
  font-weight:800;
  width:100%;
  margin-top:16px;
  cursor:pointer
}
button:disabled{
  opacity:.6;
  cursor:wait
}
.status{
  color:#e8bd62;
  min-height:24px;
  overflow-wrap:anywhere
}
hr{
  border:0;
  border-top:1px solid #4b3856;
  margin:22px 0
}
[hidden]{display:none!important}
</style>
</head>

<body>
<main class="box">

<h1>Only Habesha Admin</h1>
<p class="muted">Authorized administrators only.</p>

<form id="login">
  <label for="password">Admin Password</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    required
  >
  <button type="submit">Login</button>
</form>

<p class="status" id="status" aria-live="polite"></p>

<div id="inside" hidden>

  <h2>Welcome</h2>
  <p class="muted">Admin Panel — Video Upload</p>

  <hr>

  <h2>Upload Video</h2>

  <label for="video">Choose a video from your phone</label>
  <input
    id="video"
    type="file"
    accept="video/*"
  >

  <button id="upload" type="button">Upload Video</button>

  <p class="status" id="uploadStatus" aria-live="polite"></p>

  <hr>

  <p class="muted">
    Videos are stored in Private Blob storage. Publishing videos on the
    website and granting VIP members permission to watch them must be
    configured separately.
  </p>

  <button id="logout" type="button">Logout</button>

</div>
</main>

<script type="module">
import { upload } from "https://esm.sh/@vercel/blob@2.6.1/client";

const form = document.getElementById("login");
const statusEl = document.getElementById("status");
const inside = document.getElementById("inside");
const videoInput = document.getElementById("video");
const uploadButton = document.getElementById("upload");
const uploadStatus = document.getElementById("uploadStatus");

function showAdmin() {
  form.hidden = true;
  inside.hidden = false;
}

async function check() {
  try {
    const response = await fetch("/api/admin-session", {
      credentials: "same-origin",
      cache: "no-store"
    });

    const data = await response.json();

    if (response.ok && data.authenticated) {
      showAdmin();
    }
  } catch (error) {
    console.error("Session check failed:", error);
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  statusEl.textContent = "Checking login...";

  try {
    const response = await fetch("/api/admin-login", {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        password: document.getElementById("password").value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Login failed.");
    }

    document.getElementById("password").value = "";
    statusEl.textContent = "";
    showAdmin();

  } catch (error) {
    statusEl.textContent = error.message || "An error occurred.";
    document.getElementById("password").value = "";
  }
});

uploadButton.addEventListener("click", async () => {
  const file = videoInput.files && videoInput.files[0];

  if (!file) {
    uploadStatus.textContent = "Please select a video first.";
    return;
  }

  if (!file.type.startsWith("video/")) {
    uploadStatus.textContent = "Please select a valid video file.";
    return;
  }

  uploadButton.disabled = true;
  uploadStatus.textContent = "Uploading video. Please wait...";

  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    const result = await upload(
      "videos/" + safeName,
      file,
      {
        access: "private",
        handleUploadUrl: "/api/video-upload",

        onUploadProgress: (event) => {
          uploadStatus.textContent =
            "Upload progress: " +
            Math.round(event.percentage) +
            "%";
        }
      }
    );

    uploadStatus.textContent =
      "Upload successful! File path: " + result.pathname;

    videoInput.value = "";

  } catch (error) {
    uploadStatus.textContent =
      "Upload failed. Please check your admin login and Blob configuration.";

    console.error("Video upload error:", error);

  } finally {
    uploadButton.disabled = false;
  }
});

document.getElementById("logout").addEventListener("click", async () => {
  try {
    await fetch("/api/admin-logout", {
      method: "POST",
      credentials: "same-origin"
    });
  } catch (error) {
    console.error("Logout failed:", error);
  } finally {
    location.reload();
  }
});

check();
</script>
</body>
</html>
