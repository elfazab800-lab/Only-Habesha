
<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Only Habesha Admin</title>
<style>
body{margin:0;background:#120d18;color:#fff8ef;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
.box{width:min(430px,100%);background:#211729;border:1px solid #4b3856;border-radius:16px;padding:24px;box-sizing:border-box}
h1{color:#e8bd62}h2{font-size:20px}
.muted{color:#c9bdcf}
label{display:block;margin:14px 0 6px}
input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #4b3856;background:#130e18;color:white}
button{background:#e8bd62;color:#1b1220;border:0;border-radius:8px;padding:12px 16px;font-weight:800;width:100%;margin-top:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.status{color:#e8bd62;min-height:24px;overflow-wrap:anywhere}
hr{border:0;border-top:1px solid #4b3856;margin:22px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="box">
<h1>Only Habesha Admin</h1>
<p class="muted">Зөвшөөрөгдсөн админ л нэвтэрнэ.</p>

<form id="login">
<label for="password">Admin password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button type="submit">Нэвтрэх / Login</button>
</form>

<p class="status" id="status" aria-live="polite"></p>

<div id="inside" hidden>
<h2>Тавтай морилно уу</h2>
<p class="muted">Admin Panel — Video Upload</p>

<hr>
<h2>Видео оруулах / Upload Video</h2>
<label for="video">Утаснаасаа видео сонгоно уу</label>
<input id="video" type="file" accept="video/*">

<button id="upload" type="button">Видео оруулах / Upload</button>
<p class="status" id="uploadStatus" aria-live="polite"></p>

<hr>
<p class="muted">
Видео Private Blob-д хадгалагдана. Энэ хэсэг нь видео хадгалах зориулалттай; сайтад нийтлэх жагсаалт болон VIP гишүүдэд үзүүлэх эрхийг тусад нь холбох шаардлагатай.
</p>

<button id="logout" type="button">Гарах / Logout</button>
</div>
</main>

<script type="module">
import { upload } from "https://esm.sh/@vercel/blob@2.6.1/client";

const form = document.getElementById("login");
const statusEl = document.getElementById("status");
const inside = document.getElementById("inside");
const videoInput = document.getElementById("video");
const uploadButton = document.getElementById("upload");
const uploadStatus = document.getElementById("uploadStatus");

function showAdmin() {
  form.hidden = true;
  inside.hidden = false;
}

async function check() {
  try {
    const r = await fetch("/api/admin-session", {
      credentials: "same-origin",
      cache: "no-store"
    });
    const d = await r.json();
    if (r.ok && d.authenticated) showAdmin();
  } catch (e) {}
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  statusEl.textContent = "Нэвтрэлтийг шалгаж байна…";

  try {
    const r = await fetch("/api/admin-login", {
      method: "POST",
      credentials: "same-origin",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        password: document.getElementById("password").value
      })
    });

    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Нэвтрэлт амжилтгүй боллоо");

    statusEl.textContent = "";
    showAdmin();
  } catch (err) {
    statusEl.textContent = err.message || "Алдаа гарлаа";
    document.getElementById("password").value = "";
  }
});

uploadButton.addEventListener("click", async () => {
  const file = videoInput.files && videoInput.files[0];

  if (!file) {
    uploadStatus.textContent = "Эхлээд видео сонгоно уу.";
    return;
  }

  if (!file.type.startsWith("video/")) {
    uploadStatus.textContent = "Видео файл сонгоно уу.";
    return;
  }

  uploadButton.disabled = true;
  uploadStatus.textContent = "Видео оруулж байна. Хүлээнэ үү…";

  try {
    const result = await upload(
      "videos/" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_"),
      file,
      {
        access: "private",
        handleUploadUrl: "/api/video-upload",
        onUploadProgress: (event) => {
          uploadStatus.textContent =
            "Upload: " + Math.round(event.percentage) + "%";
        }
      }
    );

    uploadStatus.textContent =
      "Upload амжилттай! Файлын зам: " + result.pathname;
    videoInput.value = "";
  } catch (err) {
    uploadStatus.textContent =
      "Upload амжилтгүй боллоо. Админ нэвтрэлт болон Blob тохиргоог шалгана уу.";
    console.error("Video upload error:", err);
  } finally {
    uploadButton.disabled = false;
  }
});

document.getElementById("logout").addEventListener("click", async () => {
  try {
    await fetch("/api/admin-logout", {
      method: "POST",
      credentials: "same-origin"
    });
  } finally {
    location.reload();
  }
});

check();
</script>
</body>
</html>
